name: Update lottery history

on:
  schedule:
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update historical data
        shell: bash
        run: |
          python <<'PY'
          import csv
          import io
          import re
          import urllib.request
          from datetime import datetime

          SUPER_FILE = "SuperEnalotto_History.csv"
          EURO_FILE = "EuroJackpot_History.csv"

          SUPER_BACKUP = (
              "https://raw.githubusercontent.com/"
              "rogerouffoue123-sketch/lotto-generator-data/"
              "33d99e5/SuperEnalotto_History.csv"
          )

          SUPER_SOURCE = (
              "https://www.magicolotto.net/"
              "superenalotto/archivio.php"
          )

          EURO_SOURCE = (
              "https://www.xamig.com/"
              "eurojackpot/2026/estrazioni.php"
          )

          USER_AGENT = "LOTTO-GENERATOR-history-updater/2.0"

          def download(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": USER_AGENT}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read().decode("utf-8", errors="replace")

          def normalize_text(html):
              text = re.sub(r"<script.*?</script>", " ", html,
                            flags=re.I | re.S)
              text = re.sub(r"<style.*?</style>", " ", text,
                            flags=re.I | re.S)
              text = re.sub(r"<[^>]+>", " ", text)
              text = (
                  text.replace("&nbsp;", " ")
                      .replace("&#39;", "'")
                      .replace("&amp;", "&")
              )
              return re.sub(r"\s+", " ", text).strip()

          def parse_super_source():
              html = download(SUPER_SOURCE)
              text = normalize_text(html)

              pattern = re.compile(
                  r"Data:\s*(\d{2}/\d{2}/\d{4})\s*-\s*"
                  r"Concorso\s*(\d+)\s+"
                  r"(\d+)\s+(\d+)\s+(\d+)\s+"
                  r"(\d+)\s+(\d+)\s+(\d+)\s+"
                  r"Jolly",
                  re.I
              )

              matches = pattern.findall(text)

              if not matches:
                  raise RuntimeError(
                      "SuperEnalotto: impossible de lire la source."
                  )

              draws = []

              for match in matches:
                  date_text = match[0]
                  contest = int(match[1])
                  numbers = [int(x) for x in match[2:8]]

                  if len(numbers) != 6:
                      continue

                  if len(set(numbers)) != 6:
                      continue

                  if not all(1 <= n <= 90 for n in numbers):
                      continue

                  date_value = datetime.strptime(
                      date_text,
                      "%d/%m/%Y"
                  )

                  if date_value < datetime(1997, 12, 3):
                      continue

                  draws.append(
                      (
                          date_value.strftime("%Y-%m-%d"),
                          contest,
                          sorted(numbers)
                      )
                  )

              if not draws:
                  raise RuntimeError(
                      "SuperEnalotto: aucun tirage valide."
                  )

              return draws

          def parse_euro_source():
              html = download(EURO_SOURCE)

              rows = re.findall(
                  r"<tr[^>]*>(.*?)</tr>",
                  html,
                  flags=re.I | re.S
              )

              draws = []

              for row in rows:
                  cells = re.findall(
                      r"<t[dh][^>]*>(.*?)</t[dh]>",
                      row,
                      flags=re.I | re.S
                  )

                  clean = []

                  for cell in cells:
                      value = re.sub(r"<[^>]+>", " ", cell)
                      value = re.sub(r"\s+", " ", value).strip()
                      clean.append(value)

                  if len(clean) < 8:
                      continue

                  if not re.fullmatch(r"\d+", clean[0]):
                      continue

                  if not re.fullmatch(
                      r"\d{2}/\d{2}/\d{4}",
                      clean[1]
                  ):
                      continue

                  try:
                      contest = int(clean[0])
                      date_value = datetime.strptime(
                          clean[1],
                          "%d/%m/%Y"
                      )

                      main = [int(x) for x in clean[2:7]]
                      euro = [int(x) for x in clean[7:9]]

                  except ValueError:
                      continue

                  if len(main) != 5 or len(euro) != 2:
                      continue

                  if len(set(main)) != 5:
                      continue

                  if len(set(euro)) != 2:
                      continue

                  if not all(1 <= n <= 50 for n in main):
                      continue

                  if not all(1 <= n <= 12 for n in euro):
                      continue

                  if date_value < datetime(2022, 3, 25):
                      continue

                  draws.append(
                      (
                          date_value.strftime("%d/%m/%Y"),
                          contest,
                          sorted(main),
                          sorted(euro)
                      )
                  )

              if not draws:
                  raise RuntimeError(
                      "EuroJackpot: impossible de lire la source."
                  )

              return draws

          def valid_super_file(path):
              try:
                  with open(
                      path,
                      encoding="utf-8-sig",
                      newline=""
                  ) as f:
                      rows = list(csv.reader(f))

                  if len(rows) < 4200:
                      return False

                  for row in rows[1:]:
                      if len(row) != 8:
                          return False

                      datetime.strptime(
                          row[0],
                          "%Y-%m-%d"
                      )

                      contest = int(row[1])

                      if contest < 0:
                          return False

                      numbers = [int(x) for x in row[2:8]]

                      if len(set(numbers)) != 6:
                          return False

                      if not all(
                          1 <= n <= 90
                          for n in numbers
                      ):
                          return False

                  return True

              except Exception:
                  return False

          def restore_super_if_needed():
              if valid_super_file(SUPER_FILE):
                  print("SuperEnalotto: fichier actuel valide.")
                  return

              print(
                  "SuperEnalotto: fichier actuel invalide."
                  " Restauration de la sauvegarde."
              )

              backup = download(SUPER_BACKUP)

              with open(
                  SUPER_FILE,
                  "w",
                  encoding="utf-8",
                  newline=""
              ) as f:
                  f.write(backup)

              if not valid_super_file(SUPER_FILE):
                  raise RuntimeError(
                      "SuperEnalotto: restauration impossible."
                  )

              print(
                  "SuperEnalotto: sauvegarde restaurée."
              )

          def load_super():
              rows = []

              with open(
                  SUPER_FILE,
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  reader = csv.reader(f)

                  next(reader)

                  for row in reader:
                      if len(row) != 8:
                          continue

                      rows.append(
                          (
                              row[0],
                              int(row[1]),
                              sorted(int(x) for x in row[2:8])
                          )
                      )

              return rows

          def load_euro():
              rows = []

              if not __import__("os").path.exists(EURO_FILE):
                  return rows

              with open(
                  EURO_FILE,
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  reader = csv.reader(
                      f,
                      delimiter=";"
                  )

                  next(reader)

                  for row in reader:
                      if len(row) != 8:
                          continue

                      rows.append(
                          (
                              row[0],
                              sorted(int(x) for x in row[1:6]),
                              sorted(int(x) for x in row[6:8])
                          )
                      )

              return rows

          restore_super_if_needed()

          # -----------------------------------------------
          # SUPERENALOTTO
          # -----------------------------------------------

          super_rows = load_super()
          super_source_rows = parse_super_source()

          existing_super = {
              (
                  date,
                  tuple(numbers)
              )
              for date, contest, numbers in super_rows
          }

          added_super = 0

          for date, contest, numbers in super_source_rows:

              key = (
                  date,
                  tuple(numbers)
              )

              if key in existing_super:
                  continue

              super_rows.append(
                  (
                      date,
                      contest,
                      numbers
                  )
              )

              existing_super.add(key)
              added_super += 1

          super_rows.sort(
              key=lambda x: datetime.strptime(
                  x[0],
                  "%Y-%m-%d"
              )
          )

          if not super_rows:
              raise RuntimeError(
                  "SuperEnalotto: aucun historique."
              )

          latest_super = max(
              datetime.strptime(x[0], "%Y-%m-%d")
              for x in super_rows
          )

          if latest_super < datetime(2026, 9, 8):
              raise RuntimeError(
                  "SuperEnalotto: la source ne contient pas "
                  "encore le tirage du 08/09/2026."
              )

          with open(
              SUPER_FILE,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.writer(f)

              writer.writerow(
                  [
                      "date",
                      "concorso",
                      "n1",
                      "n2",
                      "n3",
                      "n4",
                      "n5",
                      "n6"
                  ]
              )

              for date, contest, numbers in super_rows:
                  writer.writerow(
                      [
                          date,
                          contest,
                          *numbers
                      ]
                  )

          print(
              f"SuperEnalotto: {added_super} nouveau(x) tirage(s)."
          )

          print(
              f"SuperEnalotto: dernier = "
              f"{latest_super.date()}"
          )

          # -----------------------------------------------
          # EUROJACKPOT
          # -----------------------------------------------

          euro_rows = load_euro()
          euro_source_rows = parse_euro_source()

          existing_euro = {
              (
                  date,
                  tuple(main),
                  tuple(euro)
              )
              for date, main, euro in euro_rows
          }

          added_euro = 0

          for date, contest, main, euro in euro_source_rows:

              key = (
                  date,
                  tuple(main),
                  tuple(euro)
              )

              if key in existing_euro:
                  continue

              euro_rows.append(
                  (
                      date,
                      main,
                      euro
                  )
              )

              existing_euro.add(key)
              added_euro += 1

          euro_rows.sort(
              key=lambda x: datetime.strptime(
                  x[0],
                  "%d/%m/%Y"
              )
          )

          if not euro_rows:
              raise RuntimeError(
                  "EuroJackpot: aucun historique."
              )

          latest_euro = max(
              datetime.strptime(
                  x[0],
                  "%d/%m/%Y"
              )
              for x in euro_rows
          )

          if latest_euro < datetime(2026, 9, 8):
              raise RuntimeError(
                  "EuroJackpot: la source ne contient pas "
                  "encore le tirage du 08/09/2026."
              )

          with open(
              EURO_FILE,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.writer(
                  f,
                  delimiter=";"
              )

              writer.writerow(
                  [
                      "DATA",
                      "N1",
                      "N2",
                      "N3",
                      "N4",
                      "N5",
                      "E1",
                      "E2"
                  ]
              )

              for date, main, euro in euro_rows:
                  writer.writerow(
                      [
                          date,
                          *main,
                          *euro
                      ]
                  )

          print(
              f"EuroJackpot: {added_euro} nouveau(x) tirage(s)."
          )

          print(
              f"EuroJackpot: dernier = "
              f"{latest_euro.date()}"
          )

          print("Mise à jour terminée avec succès.")
          PY

      - name: Commit updated history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SuperEnalotto_History.csv EuroJackpot_History.csv

          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
            exit 0
          fi

          git commit -m "Update lottery history"
          git push
