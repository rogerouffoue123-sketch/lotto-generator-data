
              if parsed is None:
                  continue

              date_text, main, euro = parsed

              key = datetime.strptime(
                  date_text,
                  "%d/%m/%Y"
              ).strftime("%Y-%m-%d")

              if key not in euro_data:
                  added_euro += 1

              euro_data[key] = (
                  date_text,
                  main,
                  euro
              )

          euro_rows = sorted(
              euro_data.values(),
              key=lambda x: datetime.strptime(
                  x[0],
                  "%d/%m/%Y"
              )
          )

          if not euro_rows:
              raise RuntimeError(
                  "EuroJackpot: aucun tirage valide."
              )

          latest_euro = max(
              datetime.strptime(
                  row[0],
                  "%d/%m/%Y"
              )
              for row in euro_rows
          )

          print(
              f"EuroJackpot: {len(euro_rows)} tirages"
          )

          print(
              f"EuroJackpot: {added_euro} nouveau(x)"
          )

          print(
              f"EuroJackpot: dernier = "
              f"{latest_euro.strftime('%Y-%m-%d')}"
          )

          # Hard safety check for the latest known EuroJackpot draw.
          # This prevents a successful workflow from silently keeping
          # draw 78 when draw 79 is already published.
          if (
              latest_euro.date()
              >= datetime(2026, 9, 29).date()
          ):
              if not any(
                  row[0] == "29/09/2026"
                  and row[1] == [
                      21, 30, 36, 43, 48
                  ]
                  and row[2] == [1, 5]
                  for row in euro_rows
              ):
                  raise RuntimeError(
                      "EuroJackpot: le tirage du "
                      "29/09/2026 est absent ou incorrect."
                  )

          with open(
              EURO_FILE,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.writer(
                  f,
                  delimiter=";"
              )

              writer.writerow([
                  "DATA",
                  "N1",
                  "N2",
                  "N3",
                  "N4",
                  "N5",
                  "E1",
                  "E2"
              ])

              for date, main, euro in euro_rows:
                  writer.writerow([
                      date,
                      *[
                          f"{n:02d}"
                          for n in main
                      ],
                      *[
                          f"{n:02d}"
                          for n in euro
                      ]
                  ])

          print(
              "=== VALIDATION FINALE ==="
          )

          print(
              "SuperEnalotto dernier: "
              f"{latest_super.strftime('%Y-%m-%d')}"
          )

          print(
              "EuroJackpot dernier: "
              f"{latest_euro.strftime('%Y-%m-%d')}"
          )

          print(
              "Mise à jour terminée avec succès."
          )
          PY

      - name: Commit updated history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main

          git add SuperEnalotto_History.csv EuroJackpot_History.csv

          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
            exit 0
          fi

          git commit -m "Update lottery history"
          git push
