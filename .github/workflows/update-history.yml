name: Update lottery history

on:
  schedule:
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update historical data
        shell: bash
        run: |
          python <<'PY'
          import csv
          import io
          import re
          import urllib.request
          from datetime import datetime
          from html.parser import HTMLParser

          SUPER_BACKUP = (
              "https://raw.githubusercontent.com/"
              "rogerouffoue123-sketch/lotto-generator-data/"
              "33d99e5/SuperEnalotto_History.csv"
          )

          SUPER_SOURCE = (
              "https://www.superenalotto.it/"
              "archivio-estrazioni/2026/settembre"
          )

          EURO_SOURCE = (
              "https://www.xamig.com/"
              "eurojackpot/2026/estrazioni.php"
          )

          SUPER_FILE = "SuperEnalotto_History.csv"
          EURO_FILE = "EuroJackpot_History.csv"

          def download(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          class TableParser(HTMLParser):

              def __init__(self):
                  super().__init__()
                  self.rows = []
                  self.current_row = None
                  self.current_cell = None
                  self.text = ""

              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.current_row = []

                  elif tag in ("td", "th"):
                      self.current_cell = ""

              def handle_data(self, data):
                  if self.current_cell is not None:
                      self.current_cell += " " + data

              def handle_endtag(self, tag):
                  if tag in ("td", "th"):
                      if self.current_row is not None:
                          value = re.sub(
                              r"\s+",
                              " ",
                              self.current_cell or ""
                          ).strip()

                          self.current_row.append(value)

                      self.current_cell = None

                  elif tag == "tr":
                      if self.current_row:
                          self.rows.append(
                              self.current_row
                          )

                      self.current_row = None

          # =========================================================
          # SUPERENALOTTO
          # =========================================================

          print(
              "Chargement de la sauvegarde "
              "SuperEnalotto..."
          )

          backup_text = download(
              SUPER_BACKUP
          )

          backup_rows = list(
              csv.reader(
                  io.StringIO(backup_text)
              )
          )

          super_data = {}

          for row in backup_rows[1:]:

              if len(row) != 8:
                  continue

              try:
                  date = datetime.strptime(
                      row[0],
                      "%Y-%m-%d"
                  )

                  contest = int(row[1])

                  numbers = [
                      int(x)
                      for x in row[2:8]
                  ]

              except ValueError:
                  continue

              if contest <= 0:
                  continue

              if len(numbers) != 6:
                  continue

              if len(set(numbers)) != 6:
                  continue

              if not all(
                  1 <= n <= 90
                  for n in numbers
              ):
                  continue

              key = (
                  date.strftime("%Y-%m-%d"),
                  contest
              )

              super_data[key] = (
                  date.strftime("%Y-%m-%d"),
                  contest,
                  sorted(numbers)
              )

          print(
              f"Base propre: {len(super_data)} tirages"
          )

          print(
              "Téléchargement de l'archive "
              "officielle SuperEnalotto..."
          )

          super_html = download(
              SUPER_SOURCE
          )

          parser = TableParser()
          parser.feed(super_html)

          added_super = 0

          for row in parser.rows:

              if len(row) < 2:
                  continue

              joined = " ".join(row)

              match = re.search(
                  r"Concorso\s*(?:Nº|N°|n\.?)?\s*"
                  r"(\d+)\s+del\s+"
                  r"(\d{1,2})\s+"
                  r"([A-Za-zÀ-ÿ]+)\s+"
                  r"(\d{4})",
                  joined,
                  re.IGNORECASE
              )

              if not match:
                  continue

              contest = int(match.group(1))
              day = int(match.group(2))
              month_name = match.group(3).lower()
              year = int(match.group(4))

              months = {
                  "gennaio": 1,
                  "febbraio": 2,
                  "marzo": 3,
                  "aprile": 4,
                  "maggio": 5,
                  "giugno": 6,
                  "luglio": 7,
                  "agosto": 8,
                  "settembre": 9,
                  "ottobre": 10,
                  "novembre": 11,
                  "dicembre": 12
              }

              if month_name not in months:
                  continue

              date = datetime(
                  year,
                  months[month_name],
                  day
              )

              numbers = [
                  int(x)
                  for x in re.findall(
                      r"\b\d{1,2}\b",
                      row[1]
                  )
              ]

              if len(numbers) < 6:
                  continue

              numbers = numbers[:6]

              if not all(
                  1 <= n <= 90
                  for n in numbers
              ):
                  continue

              if len(set(numbers)) != 6:
                  continue

              key = (
                  date.strftime("%Y-%m-%d"),
                  contest
              )

              if key not in super_data:
                  added_super += 1

              super_data[key] = (
                  date.strftime("%Y-%m-%d"),
                  contest,
                  sorted(numbers)
              )

          super_rows = sorted(
              super_data.values(),
              key=lambda x: (
                  x[0],
                  x[1]
              )
          )

          latest_super = max(
              datetime.strptime(
                  row[0],
                  "%Y-%m-%d"
              )
              for row in super_rows
          )

          if latest_super < datetime(
              2026,
              9,
              8
          ):
              raise RuntimeError(
                  "SuperEnalotto: dernier tirage "
                  "trop ancien."
              )

          # Vérification stricte :
          # le concours 144 doit être présent.
          if not any(
              row[1] == 144
              and row[0] == "2026-09-08"
              and row[2] == [
                  23,
                  26,
                  41,
                  52,
                  59,
                  85
              ]
              for row in super_rows
          ):
              raise RuntimeError(
                  "SuperEnalotto: concours 144 "
                  "introuvable ou incorrect."
              )

          with open(
              SUPER_FILE,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.writer(f)

              writer.writerow([
                  "date",
                  "concorso",
                  "n1",
                  "n2",
                  "n3",
                  "n4",
                  "n5",
                  "n6"
              ])

              for date, contest, numbers in super_rows:

                  writer.writerow([
                      date,
                      contest,
                      *numbers
                  ])

          print(
              f"SuperEnalotto: "
              f"{len(super_rows)} tirages."
          )

          print(
              f"SuperEnalotto: "
              f"{added_super} nouveau(x)."
          )

          print(
              f"SuperEnalotto: dernier = "
              f"{latest_super.date()}"
          )

          # =========================================================
          # EUROJACKPOT
          # =========================================================

          print(
              "Chargement de l'historique "
              "EuroJackpot existant..."
          )

          euro_data = {}

          with open(
              EURO_FILE,
              "r",
              encoding="utf-8-sig"
          ) as f:

              reader = csv.DictReader(
                  f,
                  delimiter=";"
              )

              for row in reader:

                  try:
                      date = datetime.strptime(
                          row["DATA"],
                          "%d/%m/%Y"
                      )

                      main = [
                          int(row[f"N{i}"])
                          for i in range(1, 6)
                      ]

                      euro = [
                          int(row["E1"]),
                          int(row["E2"])
                      ]

                  except (
                      ValueError,
                      KeyError
                  ):
                      continue

                  if date < datetime(
                      2022,
                      3,
                      25
                  ):
                      continue

                  if not all(
                      1 <= n <= 50
                      for n in main
                  ):
                      continue

                  if not all(
                      1 <= n <= 12
                      for n in euro
                  ):
                      continue

                  if len(set(main)) != 5:
                      continue

                  if len(set(euro)) != 2:
                      continue

                  key = date.strftime(
                      "%Y-%m-%d"
                  )

                  euro_data[key] = (
                      date.strftime("%d/%m/%Y"),
                      sorted(main),
                      sorted(euro)
                  )

          print(
              f"Historique Euro existant: "
              f"{len(euro_data)} tirages"
          )

          print(
              "Téléchargement des nouveaux "
              "tirages EuroJackpot..."
          )

          euro_html = download(
              EURO_SOURCE
          )

          parser = TableParser()
          parser.feed(euro_html)

          added_euro = 0

          for row in parser.rows:

              if len(row) < 8:
                  continue

              date_match = None

              for cell in row:
                  date_match = re.search(
                      r"\b(\d{2}/\d{2}/\d{4})\b",
                      cell
                  )

                  if date_match:
                      break

              if not date_match:
                  continue

              date_text = date_match.group(1)

              date = datetime.strptime(
                  date_text,
                  "%d/%m/%Y"
              )

              if date < datetime(
                  2022,
                  3,
                  25
              ):
                  continue

              numbers = []

              for cell in row:

                  found = re.findall(
                      r"\b\d{1,2}\b",
                      cell
                  )

                  for value in found:

                      number = int(value)

                      if 1 <= number <= 50:
                          numbers.append(
                              number
                          )

              # On cherche une ligne contenant
              # exactement les 5 principaux + 2 Euro.
              if len(numbers) < 7:
                  continue

              main = numbers[-7:-2]
              euro = numbers[-2:]

              if not all(
                  1 <= n <= 50
                  for n in main
              ):
                  continue

              if not all(
                  1 <= n <= 12
                  for n in euro
              ):
                  continue

              if len(set(main)) != 5:
                  continue

              if len(set(euro)) != 2:
                  continue

              key = date.strftime(
                  "%Y-%m-%d"
              )

              if key not in euro_data:
                  added_euro += 1

              euro_data[key] = (
                  date.strftime("%d/%m/%Y"),
                  sorted(main),
                  sorted(euro)
              )

          euro_rows = sorted(
              euro_data.values(),
              key=lambda x: datetime.strptime(
                  x[0],
                  "%d/%m/%Y"
              )
          )

          latest_euro = max(
              datetime.strptime(
                  row[0],
                  "%d/%m/%Y"
              )
              for row in euro_rows
          )

          if latest_euro < datetime(
              2026,
              9,
              8
          ):
              raise RuntimeError(
                  "EuroJackpot: dernier tirage "
                  "trop ancien."
              )

          # Vérification stricte du dernier tirage.
          if not any(
              row[0] == "08/09/2026"
              and row[1] == [
                  14,
                  27,
                  34,
                  36,
                  47
              ]
              and row[2] == [
                  3,
                  4
              ]
              for row in euro_rows
          ):
              raise RuntimeError(
                  "EuroJackpot: tirage du "
                  "08/09/2026 incorrect."
              )

          with open(
              EURO_FILE,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.writer(
                  f,
                  delimiter=";"
              )

              writer.writerow([
                  "DATA",
                  "N1",
                  "N2",
                  "N3",
                  "N4",
                  "N5",
                  "E1",
                  "E2"
              ])

              for date, main, euro in euro_rows:

                  writer.writerow([
                      date,
                      *[
                          f"{n:02d}"
                          for n in main
                      ],
                      *[
                          f"{n:02d}"
                          for n in euro
                      ]
                  ])

          print(
              f"EuroJackpot: "
              f"{len(euro_rows)} tirages."
          )

          print(
              f"EuroJackpot: "
              f"{added_euro} nouveau(x)."
          )

          print(
              f"EuroJackpot: dernier = "
              f"{latest_euro.date()}"
          )

          print(
              "Mise à jour terminée avec succès."
          )
          PY
          
      - name: Commit updated history
  shell: bash
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git pull --rebase origin main

    git add SuperEnalotto_History.csv EuroJackpot_History.csv

    if git diff --cached --quiet; then
      echo "Aucune nouvelle donnée."
      exit 0
    fi

    git commit -m "Update lottery history"
    git push
