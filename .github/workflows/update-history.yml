name: Update lottery history

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update historical data
        shell: bash
        run: |
          python <<'PY'
          import csv
          import io
          import urllib.request
          from datetime import datetime

          SUPER_URL = "https://www.estrazioni.it/index.php?formato=csv&p=download&tipo=superenalotto"
          EURO_URL = "https://www.estrazioni.it/index.php?formato=csv&p=download&tipo=eurojackpot"

          SUPER_FILE = "SuperEnalotto_History.csv"
          EURO_FILE = "EuroJackpot_History.csv"

          def download(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "LOTTO-GENERATOR-history-updater/1.0"
                  }
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read().decode("utf-8-sig")

          def normalize(value):
              return value.strip().strip('"').lower().replace(" ", "").replace("_", "")

          def find_column(headers, names):
              normalized = {
                  normalize(header): i
                  for i, header in enumerate(headers)
              }

              for name in names:
                  key = normalize(name)
                  if key in normalized:
                      return normalized[key]

              return None

          def parse_date(value):
              value = value.strip().strip('"')

              for fmt in (
                  "%d/%m/%Y",
                  "%Y-%m-%d",
                  "%d-%m-%Y"
              ):
                  try:
                      return datetime.strptime(value, fmt)
                  except ValueError:
                      pass

              return None

          def read_csv_text(text):
              sample = text[:10000]

              try:
                  dialect = csv.Sniffer().sniff(
                      sample,
                      delimiters=",;"
                  )
              except csv.Error:
                  dialect = csv.excel
                  dialect.delimiter = ";"

              reader = csv.reader(
                  io.StringIO(text),
                  dialect
              )

              rows = list(reader)

              if not rows:
                  raise RuntimeError("CSV vide")

              return rows

          # ---------------------------------------------------------
          # SUPERENALOTTO
          # ---------------------------------------------------------

          print("Téléchargement SuperEnalotto...")
          super_text = download(SUPER_URL)
          super_rows = read_csv_text(super_text)

          super_header = super_rows[0]

          date_col = find_column(
              super_header,
              ["data", "date"]
          )

          contest_col = find_column(
              super_header,
              ["concorso", "contest", "numero"]
          )

          number_cols = []

          for n in range(1, 7):
              col = find_column(
                  super_header,
                  [f"n{n}", f"num{n}", f"numero{n}"]
              )
              number_cols.append(col)

          # Fallback positionnel
          if date_col is None:
              date_col = 0

          if contest_col is None:
              contest_col = 1

          if any(col is None for col in number_cols):
              number_cols = [2, 3, 4, 5, 6, 7]

          super_output = []

          for row in super_rows[1:]:
              if len(row) <= max(
                  date_col,
                  contest_col,
                  *number_cols
              ):
                  continue

              date_value = parse_date(row[date_col])

              if date_value is None:
                  continue

              if date_value < datetime(1997, 12, 3):
                  continue

              numbers = []

              for col in number_cols:
                  try:
                      number = int(row[col].strip().strip('"'))
                  except ValueError:
                      numbers = []
                      break

                  if not 1 <= number <= 90:
                      numbers = []
                      break

                  numbers.append(number)

              if len(numbers) != 6:
                  continue

              try:
                  contest = int(
                      row[contest_col].strip().strip('"')
                  )
              except ValueError:
                  contest = 0

              super_output.append(
                  (
                      date_value.strftime("%Y-%m-%d"),
                      contest,
                      numbers
                  )
              )

          # Suppression des doublons
          super_unique = {}

          for item in super_output:
              key = (
                  item[0],
                  tuple(sorted(item[2]))
              )
              super_unique[key] = item

          super_output = list(super_unique.values())
          super_output.sort(key=lambda x: x[0])

          if len(super_output) < 4200:
              raise RuntimeError(
                  f"SuperEnalotto: seulement {len(super_output)} tirages trouvés."
              )

          latest_super = max(
              datetime.strptime(x[0], "%Y-%m-%d")
              for x in super_output
          )

          print(
              f"SuperEnalotto: {len(super_output)} tirages, "
              f"dernier = {latest_super.date()}"
          )

          if latest_super < datetime(2026, 9, 1):
              raise RuntimeError(
                  "SuperEnalotto: données trop anciennes."
              )

          with open(
              SUPER_FILE,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:
              writer = csv.writer(f)
              writer.writerow(
                  [
                      "date",
                      "concorso",
                      "n1",
                      "n2",
                      "n3",
                      "n4",
                      "n5",
                      "n6"
                  ]
              )

              for date_value, contest, numbers in super_output:
                  writer.writerow(
                      [
                          date_value,
                          contest,
                          *sorted(numbers)
                      ]
                  )

          # ---------------------------------------------------------
          # EUROJACKPOT
          # ---------------------------------------------------------

          print("Téléchargement EuroJackpot...")
          euro_text = download(EURO_URL)
          euro_rows = read_csv_text(euro_text)

          euro_header = euro_rows[0]

          date_col = find_column(
              euro_header,
              ["data", "date"]
          )

          euro_number_cols = []

          for n in range(1, 6):
              col = find_column(
                  euro_header,
                  [f"n{n}", f"num{n}", f"numero{n}"]
              )
              euro_number_cols.append(col)

          euro_cols = []

          for n in range(1, 3):
              col = find_column(
                  euro_header,
                  [
                      f"e{n}",
                      f"euro{n}",
                      f"euronumero{n}"
                  ]
              )
              euro_cols.append(col)

          # Fallback positionnel
          if date_col is None:
              date_col = 0

          if any(col is None for col in euro_number_cols):
              euro_number_cols = [1, 2, 3, 4, 5]

          if any(col is None for col in euro_cols):
              euro_cols = [6, 7]

          euro_output = []

          for row in euro_rows[1:]:
              if len(row) <= max(
                  date_col,
                  *euro_number_cols,
                  *euro_cols
              ):
                  continue

              date_value = parse_date(row[date_col])

              if date_value is None:
                  continue

              # Format actuel : 5/50 + 2/12
              if date_value < datetime(2022, 3, 25):
                  continue

              main = []

              for col in euro_number_cols:
                  try:
                      number = int(row[col].strip().strip('"'))
                  except ValueError:
                      main = []
                      break

                  if not 1 <= number <= 50:
                      main = []
                      break

                  main.append(number)

              euro_numbers = []

              for col in euro_cols:
                  try:
                      number = int(row[col].strip().strip('"'))
                  except ValueError:
                      euro_numbers = []
                      break

                  if not 1 <= number <= 12:
                      euro_numbers = []
                      break

                  euro_numbers.append(number)

              if len(main) != 5 or len(euro_numbers) != 2:
                  continue

              euro_output.append(
                  (
                      date_value.strftime("%d/%m/%Y"),
                      sorted(main),
                      sorted(euro_numbers)
                  )
              )

          euro_unique = {}

          for item in euro_output:
              key = (
                  item[0],
                  tuple(item[1]),
                  tuple(item[2])
              )
              euro_unique[key] = item

          euro_output = list(euro_unique.values())

          euro_output.sort(
              key=lambda x: datetime.strptime(
                  x[0],
                  "%d/%m/%Y"
              )
          )

          if len(euro_output) < 450:
              raise RuntimeError(
                  f"EuroJackpot: seulement {len(euro_output)} tirages trouvés."
              )

          latest_euro = max(
              datetime.strptime(x[0], "%d/%m/%Y")
              for x in euro_output
          )

          print(
              f"EuroJackpot: {len(euro_output)} tirages, "
              f"dernier = {latest_euro.date()}"
          )

          if latest_euro < datetime(2026, 9, 1):
              raise RuntimeError(
                  "EuroJackpot: données trop anciennes."
              )

          with open(
              EURO_FILE,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:
              writer = csv.writer(
                  f,
                  delimiter=";"
              )

              writer.writerow(
                  [
                      "DATA",
                      "N1",
                      "N2",
                      "N3",
                      "N4",
                      "N5",
                      "E1",
                      "E2"
                  ]
              )

              for date_value, main, euro_numbers in euro_output:
                  writer.writerow(
                      [
                          date_value,
                          *[
                              f"{n:02d}"
                              for n in main
                          ],
                          *[
                              f"{n:02d}"
                              for n in euro_numbers
                          ]
                      ]
                  )

          print("Les deux historiques ont été mis à jour avec succès.")
          PY

      - name: Commit updated history
        shell: bash
        run: |
          git config user.name "LOTTO GENERATOR"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SuperEnalotto_History.csv EuroJackpot_History.csv

          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Update lottery history"
            git push
          fi
