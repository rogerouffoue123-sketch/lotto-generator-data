name: Update lottery history

on:
  schedule:
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update historical data
        shell: bash
        run: |
          python <<'PY'
          import csv
          import io
          import re
          import urllib.request
          from datetime import datetime

          SUPER_BACKUP = (
              "https://raw.githubusercontent.com/"
              "rogerouffoue123-sketch/lotto-generator-data/"
              "33d99e5/SuperEnalotto_History.csv"
          )

          SUPER_SOURCE = (
              "https://www.magicolotto.net/"
              "superenalotto/archivio.php"
          )

          EURO_SOURCE = (
              "https://www.xamig.com/"
              "eurojackpot/2026/estrazioni.php"
          )

          SUPER_FILE = "SuperEnalotto_History.csv"
          EURO_FILE = "EuroJackpot_History.csv"

          def download(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "LOTTO-GENERATOR/1.0"
                  }
              )
              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:
                  return response.read().decode("utf-8-sig")

          def clean_html(text):
              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )
              text = (
                  text.replace("&nbsp;", " ")
                      .replace("&amp;", "&")
              )
              return re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()

          # =========================================================
          # SUPERENALOTTO
          # =========================================================

          print("Chargement sauvegarde SuperEnalotto...")

          backup_text = download(SUPER_BACKUP)

          backup_rows = list(
              csv.reader(
                  io.StringIO(backup_text)
              )
          )

          super_data = {}

          for row in backup_rows[1:]:
              if len(row) != 8:
                  continue

              try:
                  date = datetime.strptime(
                      row[0],
                      "%Y-%m-%d"
                  )
                  contest = int(row[1])
                  numbers = [
                      int(x)
                      for x in row[2:8]
                  ]
              except ValueError:
                  continue

              if contest <= 0:
                  continue

              if len(numbers) != 6:
                  continue

              if not all(
                  1 <= n <= 90
                  for n in numbers
              ):
                  continue

              key = (
                  date.strftime("%Y-%m-%d"),
                  contest
              )

              super_data[key] = (
                  date.strftime("%Y-%m-%d"),
                  contest,
                  sorted(numbers)
              )

          print(
              f"Base propre: {len(super_data)} tirages"
          )

          # Récupération des 100 derniers tirages
          # depuis Magicolotto.
          print(
              "Téléchargement des derniers tirages "
              "SuperEnalotto..."
          )

          source = clean_html(
              download(SUPER_SOURCE)
          )

          pattern = re.compile(
              r"Data:\s*(\d{2}/\d{2}/\d{4})"
              r"\s*-\s*Concorso\s+(\d+)"
              r"\s+"
              r"(\d+)\s+(\d+)\s+(\d+)\s+"
              r"(\d+)\s+(\d+)\s+(\d+)"
              r"\s+Jolly"
          )

          added_super = 0

          for match in pattern.finditer(source):

              date_text = match.group(1)
              contest = int(match.group(2))

              numbers = [
                  int(match.group(i))
                  for i in range(3, 9)
              ]

              date = datetime.strptime(
                  date_text,
                  "%d/%m/%Y"
              )

              if not all(
                  1 <= n <= 90
                  for n in numbers
              ):
                  continue

              key = (
                  date.strftime("%Y-%m-%d"),
                  contest
              )

              if key not in super_data:
                  added_super += 1

              super_data[key] = (
                  date.strftime("%Y-%m-%d"),
                  contest,
                  sorted(numbers)
              )

          super_rows = sorted(
              super_data.values(),
              key=lambda x: x[0]
          )

          if len(super_rows) < 4263:
              raise RuntimeError(
                  "SuperEnalotto: historique incomplet."
              )

          latest_super = max(
              datetime.strptime(
                  x[0],
                  "%Y-%m-%d"
              )
              for x in super_rows
          )

          if latest_super < datetime(2026, 9, 8):
              raise RuntimeError(
                  "SuperEnalotto: dernier tirage "
                  "trop ancien."
              )

          with open(
              SUPER_FILE,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.writer(f)

              writer.writerow([
                  "date",
                  "concorso",
                  "n1",
                  "n2",
                  "n3",
                  "n4",
                  "n5",
                  "n6"
              ])

              for date, contest, numbers in super_rows:
                  writer.writerow([
                      date,
                      contest,
                      *numbers
                  ])

          print(
              f"SuperEnalotto: {len(super_rows)} tirages."
          )

          print(
              f"SuperEnalotto: "
              f"{added_super} nouveau(x)."
          )

          print(
              f"SuperEnalotto: dernier = "
              f"{latest_super.date()}"
          )

          # =========================================================
          # EUROJACKPOT
          # =========================================================

          print(
              "Téléchargement EuroJackpot..."
          )

          euro_source = clean_html(
              download(EURO_SOURCE)
          )

          euro_rows = []

          pattern_euro = re.compile(
              r"(\d+)\s+"
              r"(\d{2}/\d{2}/\d{4})\s+"
              r"(\d+)\s+(\d+)\s+(\d+)\s+"
              r"(\d+)\s+(\d+)\s+"
              r"(\d+)\s+(\d+)"
          )

          euro_data = {}

          for match in pattern_euro.finditer(
              euro_source
          ):

              contest = int(match.group(1))

              date = datetime.strptime(
                  match.group(2),
                  "%d/%m/%Y"
              )

              if date < datetime(2022, 3, 25):
                  continue

              main = [
                  int(match.group(i))
                  for i in range(3, 8)
              ]

              euro_numbers = [
                  int(match.group(8)),
                  int(match.group(9))
              ]

              if not all(
                  1 <= n <= 50
                  for n in main
              ):
                  continue

              if not all(
                  1 <= n <= 12
                  for n in euro_numbers
              ):
                  continue

              if len(set(main)) != 5:
                  continue

              if len(set(euro_numbers)) != 2:
                  continue

              key = date.strftime(
                  "%d/%m/%Y"
              )

              euro_data[key] = (
                  date.strftime("%d/%m/%Y"),
                  sorted(main),
                  sorted(euro_numbers)
              )

          if len(euro_data) < 450:
              raise RuntimeError(
                  "EuroJackpot: historique incomplet."
              )

          euro_rows = sorted(
              euro_data.values(),
              key=lambda x: datetime.strptime(
                  x[0],
                  "%d/%m/%Y"
              )
          )

          latest_euro = max(
              datetime.strptime(
                  x[0],
                  "%d/%m/%Y"
              )
              for x in euro_rows
          )

          if latest_euro < datetime(2026, 9, 8):
              raise RuntimeError(
                  "EuroJackpot: dernier tirage "
                  "trop ancien."
              )

          with open(
              EURO_FILE,
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.writer(
                  f,
                  delimiter=";"
              )

              writer.writerow([
                  "DATA",
                  "N1",
                  "N2",
                  "N3",
                  "N4",
                  "N5",
                  "E1",
                  "E2"
              ])

              for date, main, euro in euro_rows:
                  writer.writerow([
                      date,
                      *[
                          f"{n:02d}"
                          for n in main
                      ],
                      *[
                          f"{n:02d}"
                          for n in euro
                      ]
                  ])

          print(
              f"EuroJackpot: {len(euro_rows)} tirages."
          )

          print(
              f"EuroJackpot: dernier = "
              f"{latest_euro.date()}"
          )

          print(
              "Mise à jour terminée avec succès."
          )
          PY

      - name: Commit updated history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SuperEnalotto_History.csv EuroJackpot_History.csv

          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
            exit 0
          fi

          git commit -m "Update lottery history"
          git push
